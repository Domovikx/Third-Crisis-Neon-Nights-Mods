[package]
name = "rust-qa"
version = "0.1.0"
edition = "2021"
description = "Offline translation QA for the Third Crisis localization pipeline (parity with translate-qa)"
license = "MIT"

[lib]
name = "rust_qa"
path = "src/lib.rs"

[[bin]]
name = "rust-qa"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
# ЕДИНСТВЕННАЯ зависимость, и она обоснована: `runtime/patch_<lang>.dat` — JSONL,
# который пишет `po2dat` через `JSON.stringify`. Разбор JSON со всеми эскейпами
# (\\uXXXX, суррогатные пары, управляющие символы) — это не та задача, где ручной
# парсер оправдан: ошибка = тихо пропущенная строка и врущий отчёт. PO-парсер
# (свой, ~150 строк) остаётся своим — он простой и это ядро паритета.
serde_json = "1"
