[package]
name = "rust-qa"
version = "0.1.0"
edition = "2021"
description = "Offline translation QA for the Third Crisis localization pipeline (parity with translate-qa)"
license = "MIT"

[lib]
name = "rust_qa"
path = "src/lib.rs"

[[bin]]
name = "rust-qa"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
# PO-парсер, чтение `.dat` и JSON-писатель — общее ядро пайплайна
# (`tools/rust-l10n-core`): у POT/DAT-генераторов и QA один парсер, а не два.
rust-l10n-core = { path = "../rust-l10n-core" }
