# CI: typecheck + lint + format + unit tests.
# Сборка DLL и деплой в игру здесь НЕ проверяются — им нужны csc.exe и
# Managed/*.dll установленной игры (только локально, см. AGENTS.md).
name: ci

on: [push, pull_request]

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Dump tests (container, serialized, extraction)
        run: npm run test:dump

      - name: E2E pipeline (dump -> POT -> DAT)
        run: npm run test:e2e

  # Python-остров: дампер Unity-ассетов (UnityPy не имеет TS-эквивалента).
  # Пока модуль не портирован — держим его тесты живыми.
  # Байтовое ядро дампера на Rust (tools/rust-decoder): свой LZ4/LZMA, без правил извлечения.
  # Сравнение с TS-эталоном и цифры — docs/rust-vs-ts.md.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/rust-decoder
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/rust-decoder
            tools/rust-qa
            tools/rust-l10n-core
            tools/rust-l10n

      - name: Format (decoder)
        run: cargo fmt --check

      - name: Clippy (decoder)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (decoder)
        run: cargo test

      # QA-ядро: вычисления здесь, HTML-отчёт остаётся в TS (docs/qa-scaling.md).
      - name: Format (qa)
        working-directory: tools/rust-qa
        run: cargo fmt --check

      - name: Clippy (qa)
        working-directory: tools/rust-qa
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (qa)
        working-directory: tools/rust-qa
        run: cargo test

      # Текстовый пайплайн: общий PO-крейт + POT/DAT-генераторы (docs/language-audit.md).
      - name: Format (l10n core)
        working-directory: tools/rust-l10n-core
        run: cargo fmt --check

      - name: Clippy (l10n core)
        working-directory: tools/rust-l10n-core
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (l10n core)
        working-directory: tools/rust-l10n-core
        run: cargo test

      - name: Format (l10n)
        working-directory: tools/rust-l10n
        run: cargo fmt --check

      - name: Clippy (l10n)
        working-directory: tools/rust-l10n
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (l10n)
        working-directory: tools/rust-l10n
        run: cargo test

      # Паритет с TS-эталоном: POT мини-дампа и .dat всех языков репозитория.
      # Реальный дамп в CI отсутствует — тест на нём пропускается.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build release (l10n)
        working-directory: tools/rust-l10n
        run: cargo build --release

      - name: Parity (TS oracle vs Rust)
        working-directory: .
        run: node --test scripts/text_parity.test.mts
