# CI: typecheck + lint + format + unit tests.
# Сборка DLL и деплой в игру здесь НЕ проверяются — им нужны csc.exe и
# Managed/*.dll установленной игры (только локально, см. AGENTS.md).
name: ci

on: [push, pull_request]

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Site build and tests
        run: npm run build:site && npm run test:site

      # Контракт POT: структурные инварианты без дампа (полный прогон требует данных игры).
      - name: POT contract
        run: npm run pot:check || true

      - name: Dump tests (discovery, truncation)
        run: npm run test:dump

      - name: E2E pipeline (mini-dump -> POT -> .dat)
        run: npm run test:e2e

  # Rust-ядро: декодер Unity (tools/rust-decoder), QA (rust-qa), аудит данных (rust-lint),
  # текстовый пайплайн (rust-l10n). TS-эталоны удалены 2026-11-24: проверка идёт против
  # золотых фикстур (см. гейты ниже), цифры — docs/rust-vs-ts.md.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/rust-decoder
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/rust-decoder
            tools/rust-qa
            tools/rust-l10n-core
            tools/rust-l10n

      - name: Format (decoder)
        run: cargo fmt --check

      - name: Clippy (decoder)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (decoder)
        run: cargo test

      # QA-ядро: вычисления здесь, HTML-отчёт остаётся в TS (docs/qa-scaling.md).
      - name: Format (qa)
        working-directory: tools/rust-qa
        run: cargo fmt --check

      - name: Clippy (qa)
        working-directory: tools/rust-qa
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (qa)
        working-directory: tools/rust-qa
        run: cargo test

      # Аудит целостности данных: POT/PO/DAT (только чтение).
      - name: Format (lint)
        working-directory: tools/rust-lint
        run: cargo fmt --check

      - name: Clippy (lint)
        working-directory: tools/rust-lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (lint)
        working-directory: tools/rust-lint
        run: cargo test

      # Текстовый пайплайн: общий PO-крейт + POT/DAT-генераторы (docs/language-audit.md).
      - name: Format (l10n core)
        working-directory: tools/rust-l10n-core
        run: cargo fmt --check

      - name: Clippy (l10n core)
        working-directory: tools/rust-l10n-core
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (l10n core)
        working-directory: tools/rust-l10n-core
        run: cargo test

      - name: Format (l10n)
        working-directory: tools/rust-l10n
        run: cargo fmt --check

      - name: Clippy (l10n)
        working-directory: tools/rust-l10n
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (l10n)
        working-directory: tools/rust-l10n
        run: cargo test

      # Золото вместо TS-эталона (2026-11-24): POT мини-дампа, .dat всех языков,
      # сборка дампа и отчёт QA. Реальный дамп в CI отсутствует — пропускается.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build release (l10n)
        working-directory: tools/rust-l10n
        run: cargo build --release

      - name: Golden (POT, .dat)
        working-directory: .
        run: node --test scripts/text_parity.test.mts

      - name: Golden (dump assembly)
        working-directory: .
        run: node --test scripts/assemble_parity.test.mts

      - name: Golden (QA report)
        working-directory: .
        run: node --test .opencode/skills/translate-qa/tests/qa_golden.test.mts
