# CI: typecheck + lint + format + unit tests.
# Сборка DLL и деплой в игру здесь НЕ проверяются — им нужны csc.exe и
# Managed/*.dll установленной игры (только локально, см. AGENTS.md).
name: ci

on: [push, pull_request]

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Dump tests (container, serialized, extraction)
        run: npm run test:dump

      - name: E2E pipeline (dump -> POT -> DAT)
        run: npm run test:e2e

  # Python-остров: дампер Unity-ассетов (UnityPy не имеет TS-эквивалента).
  # Пока модуль не портирован — держим его тесты живыми.
  # Байтовое ядро дампера на Rust (tools/rust-decoder): свой LZ4/LZMA, без правил извлечения.
  # Сравнение с TS-эталоном и цифры — docs/rust-vs-ts.md.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/rust-decoder
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/rust-decoder

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
