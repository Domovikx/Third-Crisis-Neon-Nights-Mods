[package]
name = "neon-translator-dx-manager"
version = "2026.11.26-1"
edition = "2021"
description = "NeonTranslatorDX Manager (Tauri 2 shell over neon-manager-core)"
license = "MIT"

[lib]
# `_lib`, чтобы имя библиотеки не конфликтовало с бинарём на Windows.
name = "neon_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "NeonTranslatorDXManager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
neon-manager-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
